spring:
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true
        use_sql_comments: true
    open-in-view: false
logging:
  level:
    sql: debug
    com.kdt.cafe: info
    com.zaxxer.hikari.HikariConfig: info
    org.springframework.orm.jpa.JpaTransactionManager: debug
