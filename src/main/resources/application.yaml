spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3307/kdt-spring?allowPublicKeyRetrieval=true&sslMode=DISABLED
    username: root
    password: kdtpass
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
